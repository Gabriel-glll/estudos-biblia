<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudos Bíblicos</title>
<meta name="description" content="Diário de estudos bíblicos, capítulo por capítulo.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estudo.css">
</head>
<body>
<header class="ihero">
  <div class="bgimg" style="background-image:url('img/rolo-isaias.jpg')"></div>
  <div class="in">
    <div class="ref rvi">Diário de estudo</div>
    <h1 class="rvi">Estudos Bíblicos</h1>
    <p class="rvi">Capítulo por capítulo: quem escreveu, para quem, quando — e o que diz.</p>
  </div>
  <div class="credit">Grande Rolo de Isaías (Qumran) · domínio público</div>
  <div class="scrollhint">role ↓</div>
</header>
<section><div class="wide">
  <div class="kicker rvi">Estudos feitos</div>
  <h2 class="rvi">Biblioteca</h2>
  <div class="cards" id="cards"></div>
</div></section>
<footer>Textos bíblicos: Bíblia Livre (CC BY) · comparações com ARA e NAA (© SBB) em trechos curtos.</footer>
<script src="estudos/lista.js"></script>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const L = (window.ESTUDOS || []).slice().reverse();
  document.getElementById('cards').innerHTML = L.length ? L.map((e, i) => `
    <a class="card rvi" href="estudos/${esc(e.slug)}.html">
      <div class="bgimg" style="background-image:url('${esc(e.capa)}')"></div>
      <div class="in"><div class="ref">${esc(e.ref)}</div><h3>${esc(e.titulo)}</h3><div class="dt">${esc(e.data)}</div></div>
    </a>`).join('') : '<p class="empty rvi" style="grid-column:1/-1">O primeiro estudo aparece aqui. Qual capítulo vamos ler?</p>';
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), {threshold: .15});
  document.querySelectorAll(".rvi").forEach(el => io.observe(el));
  setTimeout(() => document.querySelectorAll('.ihero .rvi').forEach((el, i) => setTimeout(() => el.classList.add('in'), i * 150)), 100);
  const hero = document.querySelector('.ihero .bgimg');
  addEventListener('scroll', () => { if (scrollY < innerHeight) hero.style.transform = `translateY(${scrollY * .35}px) scale(1.05)`; }, {passive: true});
</script>
</body></html>
